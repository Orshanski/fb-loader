sonar.projectKey=Orshanski_fb-loader
sonar.organization=orshanski

# Source layout
sonar.sources=FB Loader/FB Loader
sonar.tests=FB Loader/FB LoaderTests,FB Loader/FB LoaderUITests

# Exclusions
# - docs/**       — design specs / mockup HTML, not production code
# - **/build/**   — local Xcode archive output
# - scripts/**    — bash/python tooling, not production
sonar.exclusions=docs/**,**/build/**,scripts/**

# Code coverage — produced by ./scripts/coverage.sh, fed to Sonar's
# language-agnostic Generic Test Coverage importer.
sonar.coverageReportPaths=build/coverage.xml

# Note: SonarCloud auto-scan currently ignores this file (it uses its own
# default profile). The properties here are picked up only when an explicit
# sonar-scanner CLI is invoked — see ./scripts/sonar-scan.sh.
