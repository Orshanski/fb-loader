sonar.projectKey=Orshanski_fb-loader
sonar.organization=orshanski

# Source layout
sonar.sources=FB Loader/FB Loader
sonar.tests=FB Loader/FB LoaderTests,FB Loader/FB LoaderUITests

# Exclusions
# - docs/**       — design specs / mockup HTML, not production code
# - **/build/**   — local Xcode archive output
sonar.exclusions=docs/**,**/build/**

# Per-rule suppressions (test-folder noise that doesn't reflect production quality)
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,t5,t6,t7,t8

# S100/S101: snake_case method/class names — Swift Testing & Xcode UI tests use them
sonar.issue.ignore.multicriteria.t1.ruleKey=swift:S100
sonar.issue.ignore.multicriteria.t1.resourceKey=**/FB LoaderTests/**
sonar.issue.ignore.multicriteria.t2.ruleKey=swift:S101
sonar.issue.ignore.multicriteria.t2.resourceKey=**/FB LoaderUITests/**
sonar.issue.ignore.multicriteria.t3.ruleKey=swift:S100
sonar.issue.ignore.multicriteria.t3.resourceKey=**/FB LoaderUITests/**

# S115/S116: SCREAMING_SNAKE_CASE constants & _underscored fields — common in tests
sonar.issue.ignore.multicriteria.t4.ruleKey=swift:S115
sonar.issue.ignore.multicriteria.t4.resourceKey=**/FB LoaderTests/**
sonar.issue.ignore.multicriteria.t5.ruleKey=swift:S116
sonar.issue.ignore.multicriteria.t5.resourceKey=**/FB LoaderTests/**

# S1075: hardcoded file:// URIs — testdata paths, fine in tests
sonar.issue.ignore.multicriteria.t6.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.t6.resourceKey=**/FB LoaderTests/**

# S2094: empty Swift Testing wrapper structs (`@Suite struct Group {}`) — namespacing pattern
sonar.issue.ignore.multicriteria.t7.ruleKey=swift:S2094
sonar.issue.ignore.multicriteria.t7.resourceKey=**/FB LoaderTests/**

# S100: `import_` in INPXImporter — `import` is a Swift keyword, suffix avoids backticks
sonar.issue.ignore.multicriteria.t8.ruleKey=swift:S100
sonar.issue.ignore.multicriteria.t8.resourceKey=**/Parsers/INPXImporter.swift
